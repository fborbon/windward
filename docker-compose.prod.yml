services:
  api:
    image: windward-api:latest
    container_name: windward_api_prod
    env_file: .env
    environment:
      AWS_DEFAULT_REGION: eu-west-1
    volumes:
      - ./data:/app/data
    network_mode: host
    restart: unless-stopped
    # Measured 2026-10-14 on the slim image: ~85 MB at start, ~400 MB after the heaviest
    # request (/analysis, agent graph); the worker is recycled every ~100 requests (Dockerfile).
    mem_limit: 512m
