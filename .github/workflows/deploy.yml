name: Test & Deploy

# Runs the test suite on every push to master; deploys to the live EC2 host only if tests pass.
# No SSH keys anywhere: auth is short-lived GitHub OIDC -> AWS IAM role (github-actions-windward-deploy),
# same pattern already used elsewhere in this AWS account. Deploy itself runs via AWS Systems
# Manager (SSM SendCommand), not a direct SSH connection - the runner never touches the host's
# network surface directly.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  DEPLOY_ROLE_ARN: arn:aws:iam::295936871972:role/github-actions-windward-deploy
  INSTANCE_ID: i-06b771ce9bfd7ec87

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # torch's default PyPI wheel bundles CUDA - multi-GB and unneeded here; the CPU-only
          # index keeps this step fast, and matches how the Dockerfile installs it for real.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over SSM
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "windward deploy from GitHub Actions (${{ github.sha }})" \
            --parameters commands='[
              "set -e",
              "sudo -u ubuntu git -C /home/ubuntu/Developments/windward pull",
              "cd /home/ubuntu/Developments/windward",
              "sudo docker build -t windward-api:latest -f Dockerfile .",
              "sudo docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans"
            ]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the deploy command to finish"
          exit 1

      - name: Verify the live site picked it up
        run: |
          sleep 15
          curl -sf https://windward.forwardforecasting.eu/health
